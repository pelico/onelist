plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.onelist.tv'
    compileSdk 33

    defaultConfig {
        applicationId "com.onelist.tv"
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            // AGP 7.x 默认只开 v2/v3，Android 5.1 (API 22) 只认 v1 jar signing，
            // 不开 v1 的话会报"解析包时出现问题" / INSTALL_PARSE_FAILED_NOT_APK
            // 注意：v1/v2SigningEnabled 是 SigningConfig 的属性，不能写在 buildTypes 里
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lintOptions {
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Network (统一 okhttp 版本，避免和 ExoPlayer 传递依赖冲突)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    // Video player — 2.18.7 是 2.x 的最终稳定版，支持 minSdk 16，
    // 并提供 PlaybackException / ERROR_CODE_* 精细错误码用于排障。
    // 2.16.x 没这些常量，错误回调会 Unresolved reference。
    def exoplayer_version = '2.18.7'
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation("com.google.android.exoplayer:extension-okhttp:$exoplayer_version") {
        // 强制统一 okhttp 版本为我们上面指定的 4.9.3
        exclude group: 'com.squareup.okhttp3'
    }
}
