name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download compatible Gradle
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-7.6.3-bin.zip
          unzip -q gradle-7.6.3-bin.zip
          /tmp/gradle-7.6.3/bin/gradle --version

      - name: Debug source files
        run: |
          echo "=== RetrofitClient.kt ==="
          wc -l android/app/src/main/java/com/onelist/tv/data/RetrofitClient.kt
          md5sum android/app/src/main/java/com/onelist/tv/data/RetrofitClient.kt
          cat -A android/app/src/main/java/com/onelist/tv/data/RetrofitClient.kt | head -20
          echo "..."
          cat -n android/app/src/main/java/com/onelist/tv/data/RetrofitClient.kt
          echo "=== MainActivity.kt ==="
          wc -l android/app/src/main/java/com/onelist/tv/MainActivity.kt
          md5sum android/app/src/main/java/com/onelist/tv/MainActivity.kt
          git log --oneline -3

      - name: Build APK
        run: |
          cd android
          /tmp/gradle-7.6.3/bin/gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onelist-tv-apk
          path: android/app/build/outputs/apk/release/*.apk
