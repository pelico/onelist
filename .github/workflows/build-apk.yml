name: Build Android TV APK

on:
  push:
    paths:
      - 'android/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle', 'android/app/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download compatible Gradle 7.6.3
        run: |
          for i in 1 2 3; do
            curl -fL --retry 3 --retry-delay 5 https://services.gradle.org/distributions/gradle-7.6.3-bin.zip -o /tmp/gradle.zip && break
            echo "download attempt $i failed, retrying..."
            sleep 10
          done
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-7.6.3/bin/gradle --version

      - name: Build Release APK
        working-directory: android
        run: /tmp/gradle-7.6.3/bin/gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneList-TV-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: android/app/build/outputs/apk/release/app-release.apk
          asset_name: OneList-TV-${{ github.event.release.tag_name }}.apk
          asset_content_type: application/vnd.android.package-archive
