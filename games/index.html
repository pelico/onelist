<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏中心</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #1a1a2e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "微软雅黑", sans-serif;
    min-height: 100vh;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 20px 0 30px;
}

.header h1 {
    font-size: 32px;
    color: #4ecca3;
    margin-bottom: 8px;
}

.header p {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
}

.grid {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    -webkit-justify-content: center;
    justify-content: center;
    gap: 16px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 10px;
}

.card {
    display: block;
    width: 160px;
    background: #16213e;
    border: 2px solid rgba(78, 204, 163, 0.2);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    transition: all 0.2s;
    cursor: pointer;
}

.card:hover, .card:focus {
    border-color: #4ecca3;
    background: #1e2d4a;
    transform: scale(1.03);
    outline: none;
}

.card:active {
    transform: scale(0.97);
}

.card .icon {
    font-size: 48px;
    margin-bottom: 10px;
    display: block;
}

.card .name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #fff;
}

.card .desc {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    line-height: 1.4;
}

.card .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    background: rgba(78, 204, 163, 0.15);
    color: #4ecca3;
}

.footer {
    text-align: center;
    padding: 30px 0 10px;
    color: rgba(255,255,255,0.3);
    font-size: 12px;
}

/* TV 焦点样式 */
.card.tv-focus {
    border-color: #4ecca3;
    box-shadow: 0 0 20px rgba(78, 204, 163, 0.4);
    transform: scale(1.05);
}

@media (max-width: 400px) {
    .card { width: 140px; padding: 12px; }
    .card .icon { font-size: 36px; }
    .card .name { font-size: 14px; }
    .header h1 { font-size: 24px; }
}
</style>
</head>
<body>

<div class="header">
    <h1>游戏中心</h1>
    <p>选择一个游戏开始玩</p>
</div>

<div class="grid" id="gameGrid"></div>

<div class="footer">
    方向键选择 · 确认键进入 · 返回键退出
</div>

<script>
var games = [
    { file: "%E8%B4%AA%E5%90%83%E8%9B%87.html", name: "贪吃蛇", icon: "🐍", desc: "控制蛇吃食物变长", tag: "经典" },
    { file: "%E8%B5%B0%E8%BF%B7%E5%AE%AB.html", name: "走迷宫", icon: "🏰", desc: "找到出口，3种难度", tag: "益智" },
    { file: "%E8%AE%B0%E5%BF%86%E7%BF%BB%E7%89%8C.html", name: "记忆翻牌", icon: "🃏", desc: "翻牌配对，锻炼记忆", tag: "记忆" },
    { file: "%E6%95%B0%E5%AD%A6%E5%8F%A3%E7%AE%97.html", name: "数学口算", icon: "🔢", desc: "算术题挑战", tag: "数学" },
    { file: "%E6%89%93%E5%9C%B0%E9%BC%A0.html", name: "打地鼠", icon: "🔨", desc: "快速反应打地鼠", tag: "反应" },
    { file: "%E6%95%B0%E5%AD%97%E5%8D%8E%E5%AE%B9%E9%81%93.html", name: "数字华容道", icon: "🧩", desc: "滑动拼图排数字", tag: "益智" },
    { file: "%E5%84%BF%E7%AB%A5%E6%95%B0%E7%8B%AC.html", name: "儿童数独", icon: "📊", desc: "4×4简化版数独", tag: "数学" },
    { file: "%E6%8E%A8%E7%AE%B1%E5%AD%90.html", name: "推箱子", icon: "📦", desc: "把箱子推到目标", tag: "益智" },
    { file: "%E6%89%BE%E8%A7%84%E5%BE%8B.html", name: "找规律", icon: "🔮", desc: "找出图形规律", tag: "逻辑" },
    { file: "%E6%B6%88%E6%B6%88%E4%B9%90.html", name: "消消乐", icon: "🍎", desc: "三个相同就消除", tag: "消除" },
    { file: "%E6%8E%A5%E6%B0%B4%E7%AE%A1.html", name: "接水管", icon: "🔧", desc: "旋转水管接通水流", tag: "益智" }
];

var grid = document.getElementById("gameGrid");

for (var i = 0; i < games.length; i++) {
    var g = games[i];
    var a = document.createElement("a");
    a.className = "card";
    a.href = g.file;
    a.setAttribute("tabindex", "0");

    var iconSpan = document.createElement("span");
    iconSpan.className = "icon";
    iconSpan.textContent = g.icon;
    a.appendChild(iconSpan);

    var nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = g.name;
    a.appendChild(nameDiv);

    var descDiv = document.createElement("div");
    descDiv.className = "desc";
    descDiv.textContent = g.desc;
    a.appendChild(descDiv);

    var tagSpan = document.createElement("span");
    tagSpan.className = "tag";
    tagSpan.textContent = g.tag;
    a.appendChild(tagSpan);

    grid.appendChild(a);
}

// TV 遥控器方向键导航
(function() {
    var cards = document.querySelectorAll(".card");
    var current = 0;
    var cols = 5;

    function updateFocus() {
        for (var i = 0; i < cards.length; i++) {
            if (i === current) {
                cards[i].classList.add("tv-focus");
                cards[i].focus();
            } else {
                cards[i].classList.remove("tv-focus");
            }
        }
    }

    // 计算当前行有多少列（响应式）
    function getCols() {
        if (cards.length < 2) return 1;
        var top = cards[0].getBoundingClientRect().top;
        var count = 0;
        for (var i = 0; i < cards.length; i++) {
            if (cards[i].getBoundingClientRect().top === top) {
                count++;
            } else {
                break;
            }
        }
        return count || 1;
    }

    document.addEventListener("keydown", function(e) {
        var key = e.key || e.keyCode;
        var c = getCols();

        if (key === "ArrowRight" || key === 39) {
            e.preventDefault();
            current = Math.min(cards.length - 1, current + 1);
            updateFocus();
        } else if (key === "ArrowLeft" || key === 37) {
            e.preventDefault();
            current = Math.max(0, current - 1);
            updateFocus();
        } else if (key === "ArrowDown" || key === 40) {
            e.preventDefault();
            current = Math.min(cards.length - 1, current + c);
            updateFocus();
        } else if (key === "ArrowUp" || key === 38) {
            e.preventDefault();
            current = Math.max(0, current - c);
            updateFocus();
        } else if (key === "Enter" || key === 13) {
            e.preventDefault();
            if (cards[current]) {
                cards[current].click();
            }
        }
    });

    // 初始化焦点
    updateFocus();
})();
</script>
</body>
</html>
